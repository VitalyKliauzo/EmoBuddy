<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Face Mesh -> Filled Low-Poly Avatar (controls)</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px; }
  .top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .side { display: flex; flex-direction: column; gap: 20px; }
  .wrap { position: relative; width: 320px; height: 240px; overflow: hidden; transform: scaleX(-1); cursor: grab; touch-action: none; user-select: none; }
  .wrap.dragging { cursor: grabbing; }
  video, canvas.cam { position: absolute; top: 0; left: 0; width: 320px; height: 240px; transform-origin: 0 0; }
  .hint { font-size: 12px; color: #888; margin-top: 6px; }
  #meshCanvas { background: #000; border-radius: 12px; transform: scaleX(-1); width: 960px; height: 720px; max-width: 100%; }
  h3 { margin-top: 0; }
  #status { font-size: 13px; margin-top: 8px; color: #8f8; white-space: pre-wrap; }
  #controls {
    width: 220px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 16px;
  }
  #controls h4 { margin: 0 0 12px 0; font-size: 14px; color: #ccc; }
  .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
  .control-row label { cursor: pointer; }
  .control-row button { width: 100%; background:#2a5bd7; color:#fff; border:0; border-radius:8px; padding:8px; cursor:pointer; font-size:13px; }
  .control-row button:hover { background:#3a6be7; }
  .control-row select { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 4px; }
  .control-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
</style>
</head>
<body>

<div class="top">
<div>
  <h3>Лицо из полигонов (заливка по точкам)</h3>
  <canvas id="meshCanvas" width="960" height="720"></canvas>
</div>

<div class="side">
<div>
  <h3>Камера + точки</h3>
  <div class="wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="cam" width="480" height="360"></canvas>
  </div>
  <div class="hint">Wheel: zoom &middot; drag: pan &middot; double-click: reset</div>
  <div id="status">Загрузка...</div>
</div>

<div id="controls">
  <h4>Управление</h4>
  <div class="control-row">
    <label for="togglePoints">Точки на камере</label>
    <input type="checkbox" id="togglePoints" checked>
  </div>
  <div class="control-row">
    <label for="toggleMesh">Полигоны лица</label>
    <input type="checkbox" id="toggleMesh" checked>
  </div>
  <div class="control-row">
    <label for="toggleTeeth">Зубы</label>
    <input type="checkbox" id="toggleTeeth" checked>
  </div>
  <div class="control-row">
    <label for="toggleStatus">Строка статуса</label>
    <input type="checkbox" id="toggleStatus" checked>
  </div>
  <div class="control-row">
    <label for="renderMode">Рендер</label>
    <select id="renderMode">
      <option value="flat">Плоский (2D)</option>
      <option value="smooth">Гладкий (WebGL)</option>
    </select>
  </div>
  <div class="control-row">
    <label for="faceColor">Цвет лица</label>
    <input type="color" id="faceColor" value="#d9a68a">
  </div>
  <div class="control-row">
    <label for="normalSmooth">Гладкость нормалей</label>
    <input type="range" id="normalSmooth" min="0" max="12" step="1" value="6" style="width:90px">
  </div>
  <div class="control-row">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="1" max="5" step="0.05" value="1" style="width:90px">
  </div>
  <div class="control-row">
    <button id="resetView" type="button">Reset zoom</button>
  </div>
  <div class="control-row">
    <button id="refreshPage" type="button" onclick="location.reload()">Refresh</button>
  </div>
  <div class="control-row">
    <button id="exportGlb" type="button">Скачать GLB</button>
  </div>
  <div class="control-row">
    <label for="toggleFilter">Сглаживание точек</label>
    <input type="checkbox" id="toggleFilter" checked>
  </div>
  <div class="control-row">
    <label for="filterStrength">Сила</label>
    <input type="range" id="filterStrength" min="0" max="1" step="0.05" value="0.6" style="width:90px">
  </div>
</div>
</div>
</div>

<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const meshCanvas = document.getElementById("meshCanvas");
const meshCtx = meshCanvas.getContext("2d");
const statusEl = document.getElementById("status");

const togglePoints = document.getElementById("togglePoints");
const toggleMesh = document.getElementById("toggleMesh");
const toggleStatus = document.getElementById("toggleStatus");
const toggleTeeth = document.getElementById("toggleTeeth");

toggleStatus.addEventListener("change", () => {
  statusEl.style.display = toggleStatus.checked ? "block" : "none";
});

const renderMode = document.getElementById("renderMode");
const toggleFilter = document.getElementById("toggleFilter");
const filterStrength = document.getElementById("filterStrength");
const normalSmooth = document.getElementById("normalSmooth");
const zoom = document.getElementById("zoom");
const faceColor = document.getElementById("faceColor");
const faceRGB = { r: 0, g: 0, b: 0 }; // базовый цвет лица для плоского режима
function applyFaceColor() {
  const c = faceColor.value;
  faceRGB.r = parseInt(c.slice(1, 3), 16); faceRGB.g = parseInt(c.slice(3, 5), 16); faceRGB.b = parseInt(c.slice(5, 7), 16);
  glMaterial.color.set(c);
}
faceColor.addEventListener("input", applyFaceColor);

let TRIANGLES = [];

// --- Camera crop/zoom: a square-aspect window (x0, y0, size 1/z) in normalized video coords.
// It crops the camera view, and the rendered face is mapped through the same window. ---
const camWrap = document.getElementById("camWrap");
const view = { z: 1, x0: 0, y0: 0 };
function applyView() {
  view.z = Math.min(5, Math.max(1, view.z));
  view.x0 = Math.min(1 - 1 / view.z, Math.max(0, view.x0));
  view.y0 = Math.min(1 - 1 / view.z, Math.max(0, view.y0));
  const t = `scale(${view.z}) translate(${-view.x0 * 320}px, ${-view.y0 * 240}px)`;
  video.style.transform = canvas.style.transform = t;
  zoom.value = view.z;
}
// zoom to z2 keeping the video point at display fraction (u, v) fixed; the wrapper is mirrored, so x is flipped
function zoomAt(z2, u, v) {
  const vx = view.x0 + (1 - u) / view.z, vy = view.y0 + v / view.z;
  view.z = Math.min(5, Math.max(1, z2));
  view.x0 = vx - (1 - u) / view.z;
  view.y0 = vy - v / view.z;
  applyView();
}
camWrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = camWrap.getBoundingClientRect();
  zoomAt(view.z * Math.exp(-e.deltaY * 0.002), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
}, { passive: false });
let drag = null;
camWrap.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY };
  camWrap.setPointerCapture(e.pointerId);
  camWrap.classList.add("dragging");
});
camWrap.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const r = camWrap.getBoundingClientRect();
  view.x0 += (e.clientX - drag.x) / r.width / view.z;   // mirrored: dragging right moves the window right
  view.y0 -= (e.clientY - drag.y) / r.height / view.z;
  drag = { x: e.clientX, y: e.clientY };
  applyView();
});
const endDrag = () => { drag = null; camWrap.classList.remove("dragging"); };
camWrap.addEventListener("pointerup", endDrag);
camWrap.addEventListener("pointercancel", endDrag);
function resetView() { view.z = 1; view.x0 = view.y0 = 0; applyView(); }
camWrap.addEventListener("dblclick", resetView);
document.getElementById("resetView").addEventListener("click", resetView);
zoom.addEventListener("input", () => {
  const c = view.x0 + 0.5 / view.z, d = view.y0 + 0.5 / view.z; // keep the window centre
  view.z = +zoom.value;
  view.x0 = c - 0.5 / view.z; view.y0 = d - 0.5 / view.z;
  applyView();
});

// --- One Euro filter: гасит дрожание точек, но не добавляет лаг при быстром движении ---
class OneEuro {
  constructor() { this.x = null; this.dx = 0; this.t = null; }
  static alpha(te, cutoff) { return 1 / (1 + 1 / (2 * Math.PI * cutoff) / te); }
  reset() { this.x = null; }
  filter(v, t, minCutoff, beta) {
    if (this.x === null) { this.x = v; this.dx = 0; this.t = t; return v; }
    const te = Math.max(t - this.t, 1e-3);
    this.t = t;
    const dx = (v - this.x) / te;
    this.dx += OneEuro.alpha(te, 1) * (dx - this.dx);
    const cutoff = minCutoff + beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(te, cutoff) * (v - this.x);
    return this.x;
  }
}
const filters = Array.from({ length: 478 * 3 }, () => new OneEuro());
function resetFilters() { for (const f of filters) f.reset(); }

// --- Гладкий рендер: Three.js, усреднённые нормали вершин (рисуем в offscreen-canvas, потом копируем в meshCanvas) ---
const glRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, stencil: true });
glRenderer.setSize(meshCanvas.width, meshCanvas.height, false);
glRenderer.setClearColor(0x000000, 1);
const glScene = new THREE.Scene();
const glCamera = new THREE.OrthographicCamera(0, meshCanvas.width, 0, meshCanvas.height, -2000, 2000);
glCamera.position.z = 1000;
// Освещение подобрано под палитру плоского режима: ambient 25% + направленный свет 75% (в Three.js интенсивность умножается на PI)
glScene.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.25));
const keyLight = new THREE.DirectionalLight(0xffffff, Math.PI * 0.75);
keyLight.position.set(0, -150, 1000);
glScene.add(keyLight);
const glMaterial = new THREE.MeshPhongMaterial({ color: 0xd9a68a, shininess: 10, specular: 0x000000, side: THREE.DoubleSide });
// Направление обхода у восстановленных треугольников произвольное, а DoubleSide в Three.js инвертирует нормаль у "обратных" граней -
// отсюда шахматный узор. Нормали мы уже ориентировали к камере сами, поэтому отключаем эту инверсию.
glMaterial.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <normal_fragment_begin>",
    THREE.ShaderChunk.normal_fragment_begin.replace("normal *= faceDirection;", "")
  );
};
applyFaceColor();
let lastPts = null, lastLandmarks = null;
let glMesh = null, neighbors = null, tmpNor = null;

// Считает сглаженные нормали вершин по массиву позиций pos (x вправо, y вниз, z к камере) -> nor
function computeNormals(pos, nor, count) {
  nor.fill(0);
  for (const [ia, ib, ic] of TRIANGLES) {
    const ux = pos[ib*3] - pos[ia*3], uy = pos[ib*3+1] - pos[ia*3+1], uz = pos[ib*3+2] - pos[ia*3+2];
    const vx = pos[ic*3] - pos[ia*3], vy = pos[ic*3+1] - pos[ia*3+1], vz = pos[ic*3+2] - pos[ia*3+2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; } // ориентируем нормали к камере
    for (const i of [ia, ib, ic]) { nor[i*3] += nx; nor[i*3+1] += ny; nor[i*3+2] += nz; }
  }
  // Нормали по z у MediaPipe шумные, поэтому соседние треугольники сильно различаются.
  // Размываем нормали по соседним вершинам (несколько проходов) -> плавные градиенты.
  if (!neighbors) {
    neighbors = Array.from({ length: count }, () => new Set());
    for (const [a, b, c] of TRIANGLES) {
      neighbors[a].add(b).add(c); neighbors[b].add(a).add(c); neighbors[c].add(a).add(b);
    }
    neighbors = neighbors.map(set => [...set]);
    tmpNor = new Float32Array(nor.length);
  }
  for (let it = 0; it < +normalSmooth.value; it++) {
    for (let i = 0; i < count; i++) {
      let x = nor[i*3], y = nor[i*3+1], z = nor[i*3+2];
      for (const j of neighbors[i]) { x += nor[j*3]; y += nor[j*3+1]; z += nor[j*3+2]; }
      const n = neighbors[i].length + 1;
      tmpNor[i*3] = x / n; tmpNor[i*3+1] = y / n; tmpNor[i*3+2] = z / n;
    }
    nor.set(tmpNor);
  }
  for (let i = 0; i < count; i++) {
    const l = Math.hypot(nor[i*3], nor[i*3+1], nor[i*3+2]) || 1;
    nor[i*3] /= l; nor[i*3+1] /= l; nor[i*3+2] /= l;
  }
}

// --- Экспорт текущего кадра в GLB (аватар для TalkingHead: скелет + морфы + глаза + текстура) ---
async function exportGlb() {
  if (!lastPts) { statusEl.textContent = "Нет лица в кадре (или выключены полигоны) - нечего экспортировать"; return; }
  statusEl.textContent = "Собираю GLB...";
  const [{ GLTFExporter }, { buildAvatarScene }] = await Promise.all([
    import("three/addons/exporters/GLTFExporter.js"),
    import("/src/avatarGlb.js")
  ]);
  const n = lastPts.length;
  const pos = new Float32Array(n * 3);
  const nor = new Float32Array(n * 3);
  lastPts.forEach((p, i) => { pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = -p.z; });
  computeNormals(pos, nor, n);

  // масштаб: ширина лица (точки 234-454) = 0.15 м; центр модели - среднее по вершинам; y вверх (в экране он вниз)
  const L = lastPts[234], R = lastPts[454];
  const k = 0.15 / (Math.hypot(L.x - R.x, L.y - R.y, L.z - R.z) || 1);
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    pos[i*3] = (pos[i*3] - cx) * k;
    pos[i*3+1] = -(pos[i*3+1] - cy) * k;
    pos[i*3+2] = (pos[i*3+2] - cz) * k;
    nor[i*3+1] = -nor[i*3+1];
  }

  // UV = положение точки на кадре камеры (0..1, начало слева сверху - как в glTF)
  const uv = new Float32Array(n * 2);
  lastLandmarks.forEach((l, i) => { uv[i*2] = l.x; uv[i*2+1] = l.y; });

  // текстура = текущий кадр камеры без зеркалирования (отзеркален только CSS-ом)
  const texCanvas = document.createElement("canvas");
  texCanvas.width = video.videoWidth; texCanvas.height = video.videoHeight;
  texCanvas.getContext("2d").drawImage(video, 0, 0);
  const texture = new THREE.CanvasTexture(texCanvas);
  texture.flipY = false;
  texture.colorSpace = THREE.SRGBColorSpace;

  const scene = buildAvatarScene({ positions: pos, normals: nor, uv, eyes: EYES, texture });

  new GLTFExporter().parse(scene, (buffer) => {
    const url = URL.createObjectURL(new Blob([buffer], { type: "model/gltf-binary" }));
    const a = document.createElement("a");
    a.href = url; a.download = "face.glb"; a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = `GLB сохранён (${(buffer.byteLength / 1048576).toFixed(1)} МБ): аватар для TalkingHead, текстура ${texCanvas.width}x${texCanvas.height}. Положите файл в avatars/`;
  }, (err) => { statusEl.textContent = "Ошибка экспорта GLB: " + err; }, { binary: true });
}
document.getElementById("exportGlb").addEventListener("click", exportGlb);

function drawSmooth(pts) {
  if (!glMesh) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts.length * 3), 3));
    g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(pts.length * 3), 3));
    g.setIndex(TRIANGLES.flat());
    glMesh = new THREE.Mesh(g, glMaterial);
    glMesh.frustumCulled = false;
    glScene.add(glMesh);
  }
  const pos = glMesh.geometry.attributes.position.array;
  const nor = glMesh.geometry.attributes.normal.array;
  // ближе к камере = больше z в сцене, поэтому инвертируем z MediaPipe
  pts.forEach((p, i) => { pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = -p.z; });
  computeNormals(pos, nor, pts.length);
  glMesh.geometry.attributes.position.needsUpdate = true;
  glMesh.geometry.attributes.normal.needsUpdate = true;
  updateGlEyes(pts);
  glRenderer.render(glScene, glCamera);
  meshCtx.drawImage(glRenderer.domElement, 0, 0, meshCanvas.width, meshCanvas.height);
}

// Контуры глаз и радужка (FaceLandmarker отдаёт 478 точек: 468-472 правый глаз, 473-477 левый)
const EYES = [
  { contour: [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246], iris: 468, irisEdge: [469, 471] },
  { contour: [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398], iris: 473, irisEdge: [474, 476] }
];

// Глаза в smooth-режиме рисуются в 3D-сцене на плоскости контура глаза, поэтому нос и веки перекрывают их через depth-тест.
// Белок пишет stencil только там, где он виден; радужка и зрачок рисуются только внутри этого stencil.
const EYE_BIAS = 3; // небольшой сдвиг к камере, чтобы глаз не терялся внутри поверхности меша
const stencilBase = { side: THREE.DoubleSide, stencilWrite: true, stencilRef: 1 };
const eyeMats = {
  white: new THREE.MeshBasicMaterial({ ...stencilBase, color: 0xf4f4f4, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp }),
  iris: new THREE.MeshBasicMaterial({ ...stencilBase, color: 0x3a7bd5, stencilFunc: THREE.EqualStencilFunc, depthTest: false, depthWrite: false }),
  pupil: new THREE.MeshBasicMaterial({ ...stencilBase, color: 0x000000, stencilFunc: THREE.EqualStencilFunc, depthTest: false, depthWrite: false }),
  line: new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide })
};
const IRIS_SEG = 24;
function glEyeMesh(vertCount, index, material, order) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(vertCount * 3), 3));
  g.setIndex(index);
  const m = new THREE.Mesh(g, material);
  m.frustumCulled = false;
  m.renderOrder = order;
  glScene.add(m);
  return m;
}
function fanIndex(n) { const idx = []; for (let i = 0; i < n; i++) idx.push(n, i, (i + 1) % n); return idx; }
function ringIndex(n) { const idx = []; for (let i = 0; i < n; i++) { const j = (i + 1) % n; idx.push(i, n + i, n + j, i, n + j, j); } return idx; }
const glEyes = EYES.map(eye => {
  const n = eye.contour.length;
  return {
    white: glEyeMesh(n + 1, fanIndex(n), eyeMats.white, 1),
    line: glEyeMesh(2 * n, ringIndex(n), eyeMats.line, 2),
    iris: glEyeMesh(IRIS_SEG + 1, fanIndex(IRIS_SEG), eyeMats.iris, 3),
    pupil: glEyeMesh(IRIS_SEG + 1, fanIndex(IRIS_SEG), eyeMats.pupil, 4)
  };
});

function updateGlEyes(pts) {
  const show = pts.length > 477;
  EYES.forEach((eye, k) => {
    const ge = glEyes[k];
    for (const m of Object.values(ge)) m.visible = show;
    if (!show) return;
    const ring = eye.contour.map(i => pts[i]);
    const n = ring.length;
    let cx = 0, cy = 0, cz = 0;
    for (const p of ring) { cx += p.x; cy += p.y; cz += -p.z; }
    cx /= n; cy /= n; cz /= n;
    // плоскость z = cz + gx*dx + gy*dy по МНК: радужка лежит на ней и не "проваливается" в меш при повороте головы
    let sxx = 0, sxy = 0, syy = 0, sxz = 0, syz = 0;
    for (const p of ring) {
      const dx = p.x - cx, dy = p.y - cy, dz = -p.z - cz;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy; sxz += dx * dz; syz += dy * dz;
    }
    const det = sxx * syy - sxy * sxy || 1;
    const gx = (sxz * syy - syz * sxy) / det, gy = (syz * sxx - sxz * sxy) / det;
    const planeZ = (x, y) => cz + gx * (x - cx) + gy * (y - cy) + EYE_BIAS;

    const wp = ge.white.geometry.attributes.position.array;
    const lp = ge.line.geometry.attributes.position.array;
    ring.forEach((p, i) => {
      wp.set([p.x, p.y, -p.z + EYE_BIAS], i * 3);
      const dx = p.x - cx, dy = p.y - cy, l = Math.hypot(dx, dy) || 1;
      lp.set([p.x, p.y, -p.z + EYE_BIAS + 1], i * 3);
      lp.set([p.x + dx / l * 2, p.y + dy / l * 2, -p.z + EYE_BIAS + 1], (n + i) * 3);
    });
    wp.set([cx, cy, cz + EYE_BIAS], n * 3);
    ge.white.geometry.attributes.position.needsUpdate = true;
    ge.line.geometry.attributes.position.needsUpdate = true;

    const iris = pts[eye.iris];
    const [e1, e2] = eye.irisEdge.map(i => pts[i]);
    const r = Math.hypot(e1.x - e2.x, e1.y - e2.y) / 2;
    for (const [mesh, rr] of [[ge.iris, r], [ge.pupil, r * 0.45]]) {
      const a = mesh.geometry.attributes.position.array;
      for (let i = 0; i < IRIS_SEG; i++) {
        const t = i / IRIS_SEG * 2 * Math.PI;
        const x = iris.x + Math.cos(t) * rr, y = iris.y + Math.sin(t) * rr;
        a.set([x, y, planeZ(x, y)], i * 3);
      }
      a.set([iris.x, iris.y, planeZ(iris.x, iris.y)], IRIS_SEG * 3);
      mesh.geometry.attributes.position.needsUpdate = true;
    }
  });
}

function drawEye(c, pts, eye) {
  const iris = pts[eye.iris];
  if (!iris || !pts[eye.contour[0]]) return;
  const [e1, e2] = eye.irisEdge.map(i => pts[i]);
  const irisR = Math.hypot(e1.x - e2.x, e1.y - e2.y) / 2;

  const path = () => {
    c.beginPath();
    eye.contour.forEach((i, k) => k ? c.lineTo(pts[i].x, pts[i].y) : c.moveTo(pts[i].x, pts[i].y));
    c.closePath();
  };

  path();
  c.fillStyle = "#f4f4f4";
  c.fill();

  // радужка и зрачок следуют за реальной позицией радужки с камеры; обрезаем по контуру глаза
  c.save();
  path();
  c.clip();
  c.beginPath();
  c.arc(iris.x, iris.y, irisR, 0, 2 * Math.PI);
  c.fillStyle = "#3a7bd5";
  c.fill();
  c.beginPath();
  c.arc(iris.x, iris.y, irisR * 0.45, 0, 2 * Math.PI);
  c.fillStyle = "#000";
  c.fill();
  c.restore();

  path();
  c.strokeStyle = "#222";
  c.lineWidth = 2;
  c.stroke();
}

// Внутренний контур губ слева направо: верхняя и нижняя дуги (78 и 308 - уголки рта)
const MOUTH_UPPER = [78,191,80,81,82,13,312,311,310,415,308];
const MOUTH_LOWER = [78,95,88,178,87,14,317,402,318,324,308];

// Полость рта + зубы. Рисуется поверх меша (меш закрашивает рот кожей), обрезается по внутреннему контуру губ.
// Зубы свисают от верхней/нижней губы вдоль оси лица (лоб -> подбородок), длина фиксирована и привязана к ширине рта.
function drawTeeth(c, pts) {
  const up = MOUTH_UPPER.map(i => pts[i]), lo = MOUTH_LOWER.map(i => pts[i]);
  const open = Math.hypot(pts[13].x - pts[14].x, pts[13].y - pts[14].y);
  const mouthW = Math.hypot(pts[78].x - pts[308].x, pts[78].y - pts[308].y) || 1;
  if (open < mouthW * 0.03) return; // рот закрыт - зубов не видно

  const ax = pts[152].x - pts[10].x, ay = pts[152].y - pts[10].y;
  const al = Math.hypot(ax, ay) || 1;
  const dx = ax / al, dy = ay / al; // "вниз" в системе лица

  const curve = (arr, depth) => arr.map((p, k) => {
    const w = Math.sin(Math.PI * k / (arr.length - 1)) * 0.7 + 0.3; // у уголков зубов меньше
    return { x: p.x + dx * depth * w, y: p.y + dy * depth * w };
  });
  const poly = (list) => { c.beginPath(); list.forEach((p, k) => k ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); };

  c.save();
  poly([...up, ...[...lo].reverse()]);
  c.clip();
  c.fillStyle = "#3b0d14"; // полость рта
  c.fillRect(0, 0, meshCanvas.width, meshCanvas.height);

  // фиксированная длина зубов (от ширины рта), раскрытие рта на неё не влияет - лишнее обрезает контур губ
  const upDepth = mouthW * 0.16, loDepth = mouthW * 0.12;
  const upTeeth = [...up, ...curve(up, upDepth).reverse()];
  const loTeeth = [...lo, ...curve(lo, -loDepth).reverse()];
  for (const [teeth, edge] of [[upTeeth, up], [loTeeth, lo]]) {
    poly(teeth);
    c.fillStyle = "#f6f3ea";
    c.fill();
    // промежутки между зубами
    c.strokeStyle = "rgba(120,110,100,0.55)";
    c.lineWidth = Math.max(1, mouthW * 0.008);
    const N = 8;
    c.save();
    poly(teeth);
    c.clip();
    for (let k = 1; k < N; k++) {
      const f = k / N * (edge.length - 1), i = Math.floor(f), t = f - i;
      const p = { x: edge[i].x + (edge[i+1].x - edge[i].x) * t, y: edge[i].y + (edge[i+1].y - edge[i].y) * t };
      c.beginPath();
      c.moveTo(p.x, p.y);
      c.lineTo(p.x + dx * (edge === up ? 1 : -1) * mouthW, p.y + dy * (edge === up ? 1 : -1) * mouthW);
      c.stroke();
    }
    c.restore();
  }
  c.restore();

  // обводка губ
  poly([...up, ...[...lo].reverse()]);
  c.strokeStyle = "#1c5a64";
  c.lineWidth = 1.5;
  c.stroke();
}

function buildTrianglesFromEdges(edges, pointCount) {
  const adj = Array.from({ length: pointCount }, () => new Set());
  for (const e of edges) {
    if (e.start < pointCount && e.end < pointCount) {
      adj[e.start].add(e.end);
      adj[e.end].add(e.start);
    }
  }
  const tris = [];
  for (let a = 0; a < pointCount; a++) {
    for (const b of adj[a]) {
      if (b <= a) continue;
      for (const c of adj[b]) {
        if (c <= b) continue;
        if (adj[a].has(c)) tris.push([a, b, c]);
      }
    }
  }
  return tris;
}

function resolveTriangles() {
  const src = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
  if (!Array.isArray(src) || src.length === 0) return [];
  if (typeof src[0] === "number") {
    const t = [];
    for (let i = 0; i + 2 < src.length; i += 3) t.push([src[i], src[i+1], src[i+2]]);
    return t;
  }
  return buildTrianglesFromEdges(src, 478);
}

async function main() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });

  TRIANGLES = resolveTriangles();
  statusEl.textContent = `Восстановлено треугольников: ${TRIANGLES.length}`;

  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await video.play();
  renderLoop(faceLandmarker);
}

function renderLoop(faceLandmarker) {
  const result = faceLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  meshCtx.fillStyle = "#000";
  meshCtx.fillRect(0, 0, meshCanvas.width, meshCanvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const landmarks = result.faceLandmarks[0];

    if (togglePoints.checked) {
      ctx.fillStyle = "#00FF88";
      for (const p of landmarks) {
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, 1.3, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    if (toggleMesh.checked) {
      const W = meshCanvas.width;
      const H = meshCanvas.height;
      const t = performance.now() / 1000;
      // сила 0..1 -> minCutoff от 8 Гц (слабо) до 0.3 Гц (сильно)
      const minCutoff = 8 * Math.pow(0.3 / 8, +filterStrength.value);
      const smooth = (v, i) => toggleFilter.checked ? filters[i].filter(v, t, minCutoff, 0.015) : v;
      const pts = landmarks.map((p, i) => ({
        x: smooth(p.x * W, i * 3), y: smooth(p.y * H, i * 3 + 1), z: smooth(p.z * W, i * 3 + 2)
      }));

      lastPts = pts;
      lastLandmarks = landmarks;

      // map through the camera crop window; export keeps the uncropped points
      const zk = view.z;
      const zpts = zk === 1 && view.x0 === 0 && view.y0 === 0 ? pts : pts.map(p => ({
        x: (p.x - view.x0 * W) * zk, y: (p.y - view.y0 * H) * zk, z: p.z * zk
      }));
      if (renderMode.value === "smooth") {
        drawSmooth(zpts);
      } else {
        const faces = [];
        for (const [ia, ib, ic] of TRIANGLES) {
          const a = zpts[ia], b = zpts[ib], c = zpts[ic];
          if (!a || !b || !c) continue;

          const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
          const vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
          const nx = uy * vz - uz * vy;
          const ny = uz * vx - ux * vz;
          const nz = ux * vy - uy * vx;
          const len = Math.hypot(nx, ny, nz) || 1;
          const facing = Math.abs(nz) / len;

          faces.push({ a, b, c, avgZ: (a.z + b.z + c.z) / 3, facing });
        }

        if (zpts.length > 477) for (const eye of EYES) {
          // глаз сортируется вместе с треугольниками: нос и другие ближние грани рисуются поверх него
          const ring = eye.contour.map(i => zpts[i]);
          const w = Math.hypot(ring[0].x - ring[8].x, ring[0].y - ring[8].y);
          faces.push({ eye, avgZ: ring.reduce((s, p) => s + p.z, 0) / ring.length - w * 0.15 });
        }

        faces.sort((f1, f2) => f2.avgZ - f1.avgZ);

        for (const f of faces) {
          if (f.eye) { drawEye(meshCtx, zpts, f.eye); continue; }
          const light = 0.25 + f.facing * 0.75;
          const r = Math.floor(faceRGB.r * light);
          const g = Math.floor(faceRGB.g * light);
          const b = Math.floor(faceRGB.b * light);
          meshCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          meshCtx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
          meshCtx.lineWidth = 0.6;
          meshCtx.beginPath();
          meshCtx.moveTo(f.a.x, f.a.y);
          meshCtx.lineTo(f.b.x, f.b.y);
          meshCtx.lineTo(f.c.x, f.c.y);
          meshCtx.closePath();
          meshCtx.fill();
          meshCtx.stroke();
        }
      }

      if (toggleTeeth.checked) drawTeeth(meshCtx, zpts);
    }
  } else {
    resetFilters();
  }

  requestAnimationFrame(() => renderLoop(faceLandmarker));
}

main();
</script>
