<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Face Mesh -> Filled Low-Poly Avatar (controls)</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px; }
  .top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .wrap { position: relative; width: 320px; height: 240px; }
  video, canvas.cam { position: absolute; top: 0; left: 0; width: 320px; height: 240px; }
  video { transform: scaleX(-1); }
  canvas.cam { transform: scaleX(-1); }
  #meshCanvas { background: #000; border-radius: 12px; transform: scaleX(-1); width: 960px; height: 720px; max-width: 100%; }
  h3 { margin-top: 0; }
  #status { font-size: 13px; margin-top: 8px; color: #8f8; white-space: pre-wrap; }
  #controls {
    width: 220px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 16px;
    margin-top: 28px;
  }
  #controls h4 { margin: 0 0 12px 0; font-size: 14px; color: #ccc; }
  .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
  .control-row label { cursor: pointer; }
  .control-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
</style>
</head>
<body>

<div class="top">
<div>
  <h3>Камера + точки</h3>
  <div class="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="cam" width="480" height="360"></canvas>
  </div>
  <div id="status">Загрузка...</div>
</div>

<div id="controls">
  <h4>Управление</h4>
  <div class="control-row">
    <label for="togglePoints">Точки на камере</label>
    <input type="checkbox" id="togglePoints" checked>
  </div>
  <div class="control-row">
    <label for="toggleMesh">Полигоны лица</label>
    <input type="checkbox" id="toggleMesh" checked>
  </div>
  <div class="control-row">
    <label for="toggleStatus">Строка статуса</label>
    <input type="checkbox" id="toggleStatus" checked>
  </div>
</div>
</div>

<div>
  <h3>Лицо из полигонов (заливка по точкам)</h3>
  <canvas id="meshCanvas" width="960" height="720"></canvas>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const meshCanvas = document.getElementById("meshCanvas");
const meshCtx = meshCanvas.getContext("2d");
const statusEl = document.getElementById("status");

const togglePoints = document.getElementById("togglePoints");
const toggleMesh = document.getElementById("toggleMesh");
const toggleStatus = document.getElementById("toggleStatus");

toggleStatus.addEventListener("change", () => {
  statusEl.style.display = toggleStatus.checked ? "block" : "none";
});

let TRIANGLES = [];

// Контуры глаз и радужка (FaceLandmarker отдаёт 478 точек: 468-472 правый глаз, 473-477 левый)
const EYES = [
  { contour: [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246], iris: 468, irisEdge: [469, 471] },
  { contour: [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398], iris: 473, irisEdge: [474, 476] }
];

function drawEye(c, pts, eye) {
  const iris = pts[eye.iris];
  if (!iris || !pts[eye.contour[0]]) return;
  const [e1, e2] = eye.irisEdge.map(i => pts[i]);
  const irisR = Math.hypot(e1.x - e2.x, e1.y - e2.y) / 2;

  const path = () => {
    c.beginPath();
    eye.contour.forEach((i, k) => k ? c.lineTo(pts[i].x, pts[i].y) : c.moveTo(pts[i].x, pts[i].y));
    c.closePath();
  };

  path();
  c.fillStyle = "#f4f4f4";
  c.fill();

  // радужка и зрачок следуют за реальной позицией радужки с камеры; обрезаем по контуру глаза
  c.save();
  path();
  c.clip();
  c.beginPath();
  c.arc(iris.x, iris.y, irisR, 0, 2 * Math.PI);
  c.fillStyle = "#3a7bd5";
  c.fill();
  c.beginPath();
  c.arc(iris.x, iris.y, irisR * 0.45, 0, 2 * Math.PI);
  c.fillStyle = "#000";
  c.fill();
  c.restore();

  path();
  c.strokeStyle = "#222";
  c.lineWidth = 2;
  c.stroke();
}

function buildTrianglesFromEdges(edges, pointCount) {
  const adj = Array.from({ length: pointCount }, () => new Set());
  for (const e of edges) {
    if (e.start < pointCount && e.end < pointCount) {
      adj[e.start].add(e.end);
      adj[e.end].add(e.start);
    }
  }
  const tris = [];
  for (let a = 0; a < pointCount; a++) {
    for (const b of adj[a]) {
      if (b <= a) continue;
      for (const c of adj[b]) {
        if (c <= b) continue;
        if (adj[a].has(c)) tris.push([a, b, c]);
      }
    }
  }
  return tris;
}

function resolveTriangles() {
  const src = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
  if (!Array.isArray(src) || src.length === 0) return [];
  if (typeof src[0] === "number") {
    const t = [];
    for (let i = 0; i + 2 < src.length; i += 3) t.push([src[i], src[i+1], src[i+2]]);
    return t;
  }
  return buildTrianglesFromEdges(src, 478);
}

async function main() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });

  TRIANGLES = resolveTriangles();
  statusEl.textContent = `Восстановлено треугольников: ${TRIANGLES.length}`;

  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await video.play();
  renderLoop(faceLandmarker);
}

function renderLoop(faceLandmarker) {
  const result = faceLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  meshCtx.fillStyle = "#000";
  meshCtx.fillRect(0, 0, meshCanvas.width, meshCanvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const landmarks = result.faceLandmarks[0];

    if (togglePoints.checked) {
      ctx.fillStyle = "#00FF88";
      for (const p of landmarks) {
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, 1.3, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    if (toggleMesh.checked) {
      const W = meshCanvas.width;
      const pts = landmarks.map(p => ({ x: p.x * W, y: p.y * meshCanvas.height, z: p.z * W }));

      const faces = [];
      for (const [ia, ib, ic] of TRIANGLES) {
        const a = pts[ia], b = pts[ib], c = pts[ic];
        if (!a || !b || !c) continue;

        const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
        const vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
        const nx = uy * vz - uz * vy;
        const ny = uz * vx - ux * vz;
        const nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz) || 1;
        const facing = Math.abs(nz) / len;

        faces.push({ a, b, c, avgZ: (a.z + b.z + c.z) / 3, facing });
      }

      faces.sort((f1, f2) => f2.avgZ - f1.avgZ);

      for (const f of faces) {
        const light = 0.25 + f.facing * 0.75;
        const r = Math.floor(90 * light + 40);
        const g = Math.floor(190 * light + 20);
        const b = Math.floor(200 * light + 20);
        meshCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        meshCtx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        meshCtx.lineWidth = 0.6;
        meshCtx.beginPath();
        meshCtx.moveTo(f.a.x, f.a.y);
        meshCtx.lineTo(f.b.x, f.b.y);
        meshCtx.lineTo(f.c.x, f.c.y);
        meshCtx.closePath();
        meshCtx.fill();
        meshCtx.stroke();
      }

      if (pts.length > 477) for (const eye of EYES) drawEye(meshCtx, pts, eye);
    }
  }

  requestAnimationFrame(() => renderLoop(faceLandmarker));
}

main();
</script>
</body>
</html>
