<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Face Mesh -> Triangulated Avatar</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
  .wrap { position: relative; width: 480px; }
  video, canvas.cam { position: absolute; top: 0; left: 0; width: 480px; height: 360px; }
  video { transform: scaleX(-1); }
  canvas.cam { transform: scaleX(-1); }
  #meshCanvas { background: #000; border-radius: 12px; transform: scaleX(-1); }
  h3 { margin-top: 0; }
</style>
</head>
<body>

<div>
  <h3>Camera + landmarks</h3>
  <div class="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="cam" width="480" height="360"></canvas>
  </div>
</div>

<div>
  <h3>Face mask (triangulation by landmarks)</h3>
  <canvas id="meshCanvas" width="480" height="360"></canvas>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver, FaceLandmarker as FLM } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const meshCanvas = document.getElementById("meshCanvas");
const meshCtx = meshCanvas.getContext("2d");

// Official MediaPipe triangle list (landmark indices, in triples).
// This is the standard face triangulation of 478 landmarks.
const TRIANGULATION = FaceLandmarker.FACE_LANDMARKS_TESSELATION;

async function main() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await video.play();
  renderLoop(faceLandmarker);
}

function renderLoop(faceLandmarker) {
  const result = faceLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  meshCtx.fillStyle = "#000";
  meshCtx.fillRect(0, 0, meshCanvas.width, meshCanvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const landmarks = result.faceLandmarks[0];

    // landmarks over the video
    ctx.fillStyle = "#00FF88";
    for (const p of landmarks) {
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, 1.3, 0, 2 * Math.PI);
      ctx.fill();
    }

    // convert normalized coordinates to mask canvas pixels
    const pts = landmarks.map(p => ({ x: p.x * meshCanvas.width, y: p.y * meshCanvas.height, z: p.z }));

    // sort triangles by average depth (z) so distant ones are drawn first —
    // simple pseudo-shading by depth for volume
    const tris = [];
    for (let i = 0; i < TRIANGULATION.length; i += 3) {
      const a = pts[TRIANGULATION[i]], b = pts[TRIANGULATION[i+1]], c = pts[TRIANGULATION[i+2]];
      if (!a || !b || !c) continue;
      const avgZ = (a.z + b.z + c.z) / 3;
      tris.push({ a, b, c, avgZ });
    }
    tris.sort((t1, t2) => t1.avgZ - t2.avgZ);

    for (const t of tris) {
      // color depends on depth: closer to the camera is lighter, farther is darker
      const depth = Math.max(0, Math.min(1, (t.avgZ + 0.05) / 0.1));
      const shade = Math.floor(80 + (1 - depth) * 140);
      meshCtx.fillStyle = `rgb(${shade - 30}, ${shade}, ${shade + 20})`;
      meshCtx.strokeStyle = `rgba(0,0,0,0.25)`;
      meshCtx.lineWidth = 0.5;
      meshCtx.beginPath();
      meshCtx.moveTo(t.a.x, t.a.y);
      meshCtx.lineTo(t.b.x, t.b.y);
      meshCtx.lineTo(t.c.x, t.c.y);
      meshCtx.closePath();
      meshCtx.fill();
      meshCtx.stroke();
    }
  }

  requestAnimationFrame(() => renderLoop(faceLandmarker));
}

main();
</script>
</body>
</html>
