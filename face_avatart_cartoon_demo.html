<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Face Tracking -> Cartoon Avatar Mapping Demo</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
  .wrap { position: relative; width: 480px; }
  video, canvas.cam { position: absolute; top: 0; left: 0; width: 480px; height: 360px; }
  video { transform: scaleX(-1); }
  canvas.cam { transform: scaleX(-1); }
  #avatarBox { width: 480px; height: 480px; background: #222; border-radius: 12px; }
  h3 { margin-top: 0; }
  #debug { font-size: 11px; opacity: 0.7; margin-top: 8px; line-height: 1.5; white-space: pre-wrap; }
</style>
</head>
<body>

<div>
  <h3>Камера + точки</h3>
  <div class="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="cam" width="480" height="360"></canvas>
  </div>
</div>

<div>
  <h3>Мультяшный аватар (усиленная амплитуда)</h3>
  <div id="avatarBox">
    <svg id="avatarSvg" width="480" height="480" viewBox="0 0 480 480">
      <g id="headGroup">
        <!-- уши -->
        <circle cx="110" cy="130" r="38" fill="#ffd79a" stroke="#c99a5b" stroke-width="4"/>
        <circle cx="370" cy="130" r="38" fill="#ffd79a" stroke="#c99a5b" stroke-width="4"/>

        <!-- голова -->
        <ellipse cx="240" cy="230" rx="150" ry="160" fill="#ffd79a" stroke="#c99a5b" stroke-width="4"/>

        <!-- румянец -->
        <ellipse id="cheekLeft" cx="150" cy="260" rx="22" ry="14" fill="#ff9d9d" opacity="0.6"/>
        <ellipse id="cheekRight" cx="330" cy="260" rx="22" ry="14" fill="#ff9d9d" opacity="0.6"/>

        <!-- брови: толстые, подвижные, с крупной амплитудой -->
        <path id="browLeft" d="M 130 155 Q 170 135 215 155" stroke="#5a3b1e" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path id="browRight" d="M 265 155 Q 310 135 350 155" stroke="#5a3b1e" stroke-width="14" fill="none" stroke-linecap="round"/>

        <!-- глаза: веки сверху и снизу, зрачок двигается -->
        <g id="eyeLeftGroup">
          <ellipse cx="175" cy="210" rx="34" ry="34" fill="#fff" stroke="#333" stroke-width="3"/>
          <circle id="pupilLeft" cx="175" cy="210" r="14" fill="#3a2a1a"/>
          <circle cx="179" cy="205" r="4" fill="#fff"/>
          <path id="lidTopLeft" d="M 141 210 Q 175 176 209 210 L 209 210 Q 175 196 141 210 Z" fill="#ffd79a"/>
          <path id="lidBotLeft" d="M 141 210 Q 175 244 209 210 L 209 210 Q 175 224 141 210 Z" fill="#ffd79a"/>
        </g>
        <g id="eyeRightGroup">
          <ellipse cx="305" cy="210" rx="34" ry="34" fill="#fff" stroke="#333" stroke-width="3"/>
          <circle id="pupilRight" cx="305" cy="210" r="14" fill="#3a2a1a"/>
          <circle cx="309" cy="205" r="4" fill="#fff"/>
          <path id="lidTopRight" d="M 271 210 Q 305 176 339 210 L 339 210 Q 305 196 271 210 Z" fill="#ffd79a"/>
          <path id="lidBotRight" d="M 271 210 Q 305 244 339 210 L 339 210 Q 305 224 271 210 Z" fill="#ffd79a"/>
        </g>

        <!-- нос -->
        <ellipse id="nose" cx="240" cy="255" rx="14" ry="10" fill="#e8ad6b" stroke="#c99a5b" stroke-width="2"/>

        <!-- рот: крупный, с управляемыми уголками и раскрытием -->
        <path id="mouth" d="M 190 320 Q 240 330 290 320 Q 240 330 190 320 Z" fill="#7a2f2f" stroke="#5a1f1f" stroke-width="3"/>
        <path id="tongue" d="M 220 325 Q 240 338 260 325 Z" fill="#c75c5c" opacity="0"/>
      </g>
    </svg>
  </div>
  <div id="debug"></div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const debugEl = document.getElementById("debug");

const el = (id) => document.getElementById(id);
const browLeft = el("browLeft"), browRight = el("browRight");
const pupilLeft = el("pupilLeft"), pupilRight = el("pupilRight");
const lidTopLeft = el("lidTopLeft"), lidBotLeft = el("lidBotLeft");
const lidTopRight = el("lidTopRight"), lidBotRight = el("lidBotRight");
const mouth = el("mouth"), tongue = el("tongue");
const nose = el("nose");
const cheekLeft = el("cheekLeft"), cheekRight = el("cheekRight");
const headGroup = el("headGroup");

// Коэффициент усиления — ключевое отличие от прошлой версии:
// амплитуду движений умножаем, чтобы даже слабое выражение было заметным.
const AMP = 1.6;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const boost = (v) => clamp01(v * AMP);

function lerpPath(pathA, pathB, t) {
  const numsA = pathA.match(/-?\d+(\.\d+)?/g).map(Number);
  const numsB = pathB.match(/-?\d+(\.\d+)?/g).map(Number);
  const mixed = numsA.map((a, i) => a + (numsB[i] - a) * t);
  let idx = 0;
  return pathA.replace(/-?\d+(\.\d+)?/g, () => mixed[idx++]);
}

// Опорные формы бровей: нейтраль, поднятая (крупно), нахмуренная вниз-к-переносице
const BROW_L = {
  neutral: "M 130 155 Q 170 135 215 155",
  raised:  "M 125 140 Q 170 95  220 140",
  furrow:  "M 140 175 Q 170 160 215 170"
};
const BROW_R = {
  neutral: "M 265 155 Q 310 135 350 155",
  raised:  "M 260 140 Q 310 95  355 140",
  furrow:  "M 265 170 Q 310 160 340 175"
};

function getBlendshape(blendshapes, name) {
  if (!blendshapes || blendshapes.length === 0) return 0;
  const cat = blendshapes[0].categories.find(c => c.categoryName === name);
  return cat ? cat.score : 0;
}

async function main() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true,
    runningMode: "VIDEO",
    numFaces: 1
  });
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await video.play();
  renderLoop(faceLandmarker);
}

function renderLoop(faceLandmarker) {
  const result = faceLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const landmarks = result.faceLandmarks[0];
    ctx.fillStyle = "#00FF88";
    for (const p of landmarks) {
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, 1.3, 0, 2 * Math.PI);
      ctx.fill();
    }

    const bs = result.faceBlendshapes;

    // --- Брови: подъём и нахмуривание, раздельно по сторонам ---
    const browUpL = boost(getBlendshape(bs, "browOuterUpLeft"));
    const browUpR = boost(getBlendshape(bs, "browOuterUpRight"));
    const browDown = boost(getBlendshape(bs, "browDownLeft") + getBlendshape(bs, "browDownRight"));
    browLeft.setAttribute("d",
      browDown > browUpL
        ? lerpPath(BROW_L.neutral, BROW_L.furrow, browDown)
        : lerpPath(BROW_L.neutral, BROW_L.raised, browUpL));
    browRight.setAttribute("d",
      browDown > browUpR
        ? lerpPath(BROW_R.neutral, BROW_R.furrow, browDown)
        : lerpPath(BROW_R.neutral, BROW_R.raised, browUpR));

    // --- Глаза: моргание веками (не просто сжатие эллипса) ---
    const blinkL = boost(getBlendshape(bs, "eyeBlinkLeft"));
    const blinkR = boost(getBlendshape(bs, "eyeBlinkRight"));
    const wideL = boost(getBlendshape(bs, "eyeWideLeft"));
    const wideR = boost(getBlendshape(bs, "eyeWideRight"));
    lidTopLeft.setAttribute("transform", `translate(0, ${-((1-blinkL) + wideL*0.3) * 0 + blinkL*34})`);
    lidBotLeft.setAttribute("transform", `translate(0, ${-blinkL*34})`);
    lidTopRight.setAttribute("transform", `translate(0, ${blinkR*34})`);
    lidBotRight.setAttribute("transform", `translate(0, ${-blinkR*34})`);

    // --- Взгляд: зрачки следуют за направлением глаз ---
    const lookL = getBlendshape(bs, "eyeLookOutLeft") - getBlendshape(bs, "eyeLookInLeft");
    const lookR = getBlendshape(bs, "eyeLookOutRight") - getBlendshape(bs, "eyeLookInRight");
    const lookUp = getBlendshape(bs, "eyeLookUpLeft") - getBlendshape(bs, "eyeLookDownLeft");
    pupilLeft.setAttribute("cx", 175 - lookL * 14);
    pupilLeft.setAttribute("cy", 210 - lookUp * 14);
    pupilRight.setAttribute("cx", 305 + lookR * 14);
    pupilRight.setAttribute("cy", 210 - lookUp * 14);

    // --- Рот: открытие, улыбка (растяжение уголков), поджатие ---
    const jawOpen = boost(getBlendshape(bs, "jawOpen"));
    const smile = boost(getBlendshape(bs, "mouthSmileLeft") + getBlendshape(bs, "mouthSmileRight"));
    const pucker = boost(getBlendshape(bs, "mouthPucker"));
    const openAmount = 10 + jawOpen * 90;
    const widthAmount = 50 + smile * 40 - pucker * 25;
    const cornerLift = smile * 25 - pucker * 10;
    mouth.setAttribute("d",
      `M ${240-widthAmount} ${320-cornerLift} Q 240 ${320+openAmount} ${240+widthAmount} ${320-cornerLift} Q 240 ${320+openAmount*0.3} ${240-widthAmount} ${320-cornerLift} Z`);
    tongue.setAttribute("opacity", jawOpen > 0.5 ? 0.9 : 0);

    // --- Щёки: надувание ---
    const puff = boost(getBlendshape(bs, "cheekPuff"));
    cheekLeft.setAttribute("rx", 22 + puff * 15);
    cheekRight.setAttribute("rx", 22 + puff * 15);

    // --- Нос: сморщивание ---
    const sneer = boost(getBlendshape(bs, "noseSneerLeft") + getBlendshape(bs, "noseSneerRight"));
    nose.setAttribute("ry", 10 - sneer * 4);
    nose.setAttribute("cy", 255 - sneer * 6);

    // --- Наклон и поворот головы, тоже с усилением ---
    let tiltDeg = 0, turnDeg = 0;
    if (result.facialTransformationMatrixes && result.facialTransformationMatrixes.length > 0) {
      const m = result.facialTransformationMatrixes[0].data;
      tiltDeg = Math.atan2(m[1], m[0]) * (180 / Math.PI);
      turnDeg = Math.atan2(-m[2], Math.sqrt(m[6]*m[6] + m[10]*m[10])) * (180 / Math.PI);
    }
    headGroup.setAttribute("transform",
      `rotate(${tiltDeg * AMP} 240 230) translate(${turnDeg * AMP * 1.5}, 0)`);

    debugEl.textContent =
      `brow L/R: ${browUpL.toFixed(2)}/${browUpR.toFixed(2)}  furrow: ${browDown.toFixed(2)}\n` +
      `blink L/R: ${blinkL.toFixed(2)}/${blinkR.toFixed(2)}  wide L/R: ${wideL.toFixed(2)}/${wideR.toFixed(2)}\n` +
      `jawOpen: ${jawOpen.toFixed(2)}  smile: ${smile.toFixed(2)}  pucker: ${pucker.toFixed(2)}\n` +
      `cheekPuff: ${puff.toFixed(2)}  noseSneer: ${sneer.toFixed(2)}\n` +
      `tilt: ${tiltDeg.toFixed(1)}°  turn: ${turnDeg.toFixed(1)}°`;
  }

  requestAnimationFrame(() => renderLoop(faceLandmarker));
}

main();
</script>
</body>
</html>
